<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
<title>Spy's Demise - Apple ][ clone</title>
<style>
body {
	background:#000;
	display: flex;
	flex-direction: row;
	gap: 10px;
	justify-content: center;
    align-items: center;
	font-size: 36px;
	color: #fff;
	font-family: monospace;
	overflow: hidden;
}
canvas {
    display: block;
    margin: 0;
    image-rendering: pixelated;
    width: 85vw;
    height: 85vh;
	aspect-ratio: 1 / 1;
}
#stats {
	width: 10vw;
	min-width: 90px;
	height: 85vh;
	text-align: center;
	word-wrap: break-word;
	line-height: 1;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	align-items: stretch;
}
#stats #timer, #stats #lives, #stats #btnContainer {
	margin: 10px;
}
#stats .button {
	width: 100%;
	padding: 10px 0;
	font-family: monospace;
	font-size: 12px;
	white-space: nowrap;
	border: 2px solid;
}
#stats, canvas {
	border: 2px solid;
}
#scanlines-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to right, transparent, transparent 0px, rgba(0, 0, 0, 0.33) 2px, transparent 4px);
    background-size: 100% 4px;
    opacity: 1;
    display:none;
    z-index: 10;
}
</style>
</head>
<body>
<div id="scanlines-overlay"></div>

<canvas id="game" width="600" height="600"></canvas>

<div id="stats">
	<p id="timer"></p>
	<p id="lives"></p>
	<div id="btnContainer">
		<p class="button" id="soundBtn" onclick="changeSound()"></p>
		<p class="button" id="musicBtn" onclick="changeMusic()"></p>
		<p class="button" id="scanLinesBtn" onclick="changeScanLines()"></p>
		<p class="button" id="colorModeBtn" onclick="changeColorMode()"></p>
		<p class="button" id="godModeBtn" onclick="changeGodMode()"></p>
		<p class="button" id="pauseBtn" onclick="changePause()"></p>
		<p class="button" id="resetBtn" onclick="resetGame()"></p>
	</div>
</div>

<audio id="bgMusic" loop preload="auto">
	<source src="./res/brahms.mp3" type="audio/mpeg">
</audio>
  
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const FLOORS = 10;
const FLOOR_HEIGHT = canvas.height / FLOORS;

const PLAYER_SPEED = 2.5;
const PLAYER_SIZE = 30;

const ELEVATOR_SIZE = 50;
const ELEVATORS = 7;
const ELEVATOR_MIN_SPEED = 1.5;//velocita riposo
const ELEVATOR_MAX_SPEED = 4.5;//velocita imbruttita

const elevatorsColumnWidth = (canvas.width - 2 * PLAYER_SIZE) / ELEVATORS;

const elevators = [];
const columns = [];
const floors = [];

const COLORS = { elevatorGreen : '#0f0', elevatorYellow : '#ff0', elevatorOrange : '#f80', elevatorRed : '#f00',  
				 elevatorGuard : '#000', elevatorColumn : '#fff', 
				 floor1 : '#06a', floor2 : '#a0a', floor3 : '#999', floor4 : '#0a0', greenCart : '#095',
				 hat: '#00f', glasses : '#000', jacket : '#720', skin: '#a50', bagBorder: '#fff', bagInner: '#000', feet : '#00f',
				 white : '#fff', gray : '#999', red : '#f00', green : '#0f0', black : '#000' };

let isPaused = false;//una pausa ogni tanto ci vuole!
let scanLinesEnabled = false;//a noi piacciono i monitor vintage
let colorMode = 0;//0=colori, 1=bw, 2=verde, 3=arancio
let godMode = false;//yeeees!
let lastStatsUpdate = 0;//ottimizzazione update stats

//audio
let isSoundEnabled = false;
let isMusicEnabled = false;
const elevatorSoundTop = new Audio('./res/elevator-top.wav');
const elevatorSoundBottom = new Audio('./res/elevator-bottom.wav');
const elevatorSoundHit = new Audio('./res/elevator-hit.wav');
const elevatorSoundBonus = new Audio('./res/elevator-bonus.wav');

//apple 2 beep scopiazzato da artillery che suona da dio!
function playBeep() {
  if (!isSoundEnabled) return;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  oscillator.type = 'square'; //Apple II usava un'onda quadra
  oscillator.frequency.setValueAtTime(935, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

  oscillator.connect(gain);
  gain.connect(audioCtx.destination);

  oscillator.start();
  oscillator.stop(audioCtx.currentTime + 0.1); //durata 250 ms
}

function stopMusic() {
	const music = document.getElementById("bgMusic");
	if (music) {
		music.pause();
	}
}
	
function startMusic() {
	if (!isMusicEnabled) return;
	const music = document.getElementById("bgMusic");
	if (music) {
	  music.volume = 0.5;
	  music.currentTime = 0;
	  music.play().catch((e) => {
		console.warn("🔇 bgMusic bloccata:", e);
		});
	}
}

function playElevatorSoundTop() { if (!isSoundEnabled) return; const sound = elevatorSoundTop.cloneNode(); sound.play(); }
function playElevatorSoundBottom() { if (!isSoundEnabled) return; const sound = elevatorSoundBottom.cloneNode(); sound.play(); }
function playElevatorSoundHit() { if (!isSoundEnabled) return; const sound = elevatorSoundHit.cloneNode(); sound.play(); }
function playElevatorSoundBonus() { if (!isSoundEnabled) return; const sound = elevatorSoundBonus.cloneNode(); sound.play(); }

//===== PLAYER =====
const player = {
    x: PLAYER_SIZE / 2,
	y: 0,//calcolato a caldo
    floor: 0,
    w: PLAYER_SIZE,
    h: PLAYER_SIZE,
	dir: 0,//fermo
	isMovingFloor: false,//no cambio piano
	isExploding: false,//no kaboom
	explosionX:0,
	explosionY:0,
	targetY: 0,//stesso target
	floorSpeed: 2,//velocita di salita
	lives: 5,//vite
	timer: Date.now(),//player ha 25 secondi di tempo per attraversare il floor (timer: 255...0)
	timeLeft: 255
};

//utility usata ovunque
function rnd(min, max) {
	return Math.random()* (max - min) + min;
}

//a noi ci piace scopiazzare la grafica apple2 tutta a righette
function createStripesPattern(ctx, color, ptype) {
    const pCanvas = document.createElement('canvas');
    pCanvas.width = 4;
    pCanvas.height = 4;

    const pCtx = pCanvas.getContext('2d');

    pCtx.strokeStyle = color;
    pCtx.lineWidth = 1;
    pCtx.beginPath();
	if (ptype === 0) {
		pCtx.moveTo(0, 4);
		pCtx.lineTo(4, 0);
	} else if (ptype === 1) {
		pCtx.moveTo(0, 0);
		pCtx.lineTo(4, 4);
	}
    pCtx.stroke();

    return ctx.createPattern(pCanvas, 'repeat');
}

const stripesPatternA = createStripesPattern(ctx, COLORS.floor1, 0);
const stripesPatternB = createStripesPattern(ctx, COLORS.floor2, 1);
const stripesPatternC = createStripesPattern(ctx, COLORS.floor3, 0);
const stripesPatternD = createStripesPattern(ctx, COLORS.floor4, 1);


//setta TUTTO!
function initGame() {
	//calcola y di ogni piano e uscita
	for (let i = 0; i < FLOORS; i++) {
		floors.push( { id: i, exit: i % 2 === 0 ? 'right' : 'left', y: canvas.height - 4 - i*FLOOR_HEIGHT } );        
	}

	//calcola x di ogni colonna
	for (let i = 0; i < ELEVATORS; i++) {
		columns.push( {id: i, x: PLAYER_SIZE + (elevatorsColumnWidth/2) + (elevatorsColumnWidth * i) });
	}

	//init ascensori
	for(let c of columns) {
		elevators.push({
			id: c.id,
			x: c.x,
			y: rnd(ELEVATOR_SIZE*2, canvas.height - ELEVATOR_SIZE*2),
			w: ELEVATOR_SIZE,
			h: ELEVATOR_SIZE,
			dir: rnd(0,1) > 0.5 ? 1 : -1,
			speed:2
		});
	}

	//tasti
	document.addEventListener('keydown', e => {
		if (e.key === 'ArrowLeft') player.dir = -1;
		if (e.key === 'ArrowRight') player.dir = 1;
		if (e.key === 'R' || e.key === 'r') resetGame();
		if (e.key === 'S' || e.key === 's') changeSound();
		if (e.key === 'M' || e.key === 'm') changeMusic();
		if (e.key === 'P' || e.key === 'p') changePause();
		if (e.key === 'X' || e.key === 'x') changeScanLines();
		if (e.key === 'C' || e.key === 'c') changeColorMode();
		if (e.key === 'G' || e.key === 'g') changeGodMode();
	});

	//click
	canvas.addEventListener("pointerdown", () => {
		if (player.dir !== 0) player.dir *= -1;
		else player.dir = floors[player.floor].exit === 'left' ? -1 : 1;
	});
}


//gestione scanlines on/off
function changeScanLines() {
	scanLinesEnabled = !scanLinesEnabled;
	if (scanLinesEnabled) document.getElementById('scanlines-overlay').style.display = 'block';
	else document.getElementById('scanlines-overlay').style.display = 'none';
}

//maledetti barbatrucchi
function changeGodMode() {
	godMode = !godMode;
}

//gestione colori fasulli
function changeColorMode() {
	colorMode = (colorMode + 1) % 4;
	if (colorMode === 0) {
		document.getElementById('game').style.filter = '';
		document.body.style.color = '#fff';
	}
	else if (colorMode === 1) {
		document.getElementById('game').style.filter = 'grayscale(1)';
		document.body.style.color = '#fff';
	}
	else if (colorMode === 2) {
		document.getElementById('game').style.filter = 'sepia(1) hue-rotate(60deg) saturate(5)';
		document.body.style.color = '#0f0';
	}
	else {
		document.getElementById('game').style.filter = 'sepia(1) hue-rotate(-30deg) saturate(5)';
		document.body.style.color = '#fa0';
	}
}

//gestione musica background
function changeMusic() {
	isMusicEnabled = !isMusicEnabled;
	if (isMusicEnabled) startMusic(); else stopMusic();
}

//gestione suoni ascensori/esplosione
function changeSound() {
	isSoundEnabled = !isSoundEnabled;
}

//gestione pausa
function changePause() {
	isPaused = !isPaused;
}


//resetta TUTTO o quasi
function resetGame() {
	player.x = player.w / 2;
	player.y = 0;
    player.floor = 0;
	player.dir = 0;
	player.isMovingFloor = false; //flag per animazione floor
	player.targetY = 0;           //Y del piano successivo
	player.floorSpeed = 2;        //velocita salita
	player.lives = 5;
	player.timer = Date.now();
	player.timeLeft = 255;
	
	for(let e of elevators) {
		e.y = rnd(ELEVATOR_SIZE*2, canvas.height - ELEVATOR_SIZE*2);
		e.dir = rnd(0,1) > 0.5 ? 1 : -1;
		e.speed = 2;
	}
	
	playBeep();
}

//===== COLLISION =====
function checkCollision(player, elevator) {
    return Math.abs(player.x - elevator.x) < (player.w + elevator.w)/2 &&
           Math.abs(player.y - elevator.y) < (player.h + elevator.h)/2;
}

//===== UPDATE =====
function update() {
	if (player.isExploding) return;
	if (isPaused) return;
	
	//calcola tempo trascorso
	let timeElapsed = ((Date.now() - player.timer)/100) | 0;
	player.timeLeft = 255 - timeElapsed;
	
	//... ed uccidi il player stantio
	if (player.timeLeft <= 0) {
		player.timeLeft = 0;
		if (!player.isExploding) {
			killPlayer();
			return;
		}
	}
	
	const exitSide = floors[player.floor].exit;
	
	if (player.isMovingFloor) {
		//muove il player verso targetY
		if (player.y > player.targetY) {
			player.y -= player.floorSpeed;
			if (player.y <= player.targetY) {
				player.y = player.targetY;
				player.isMovingFloor = false;
				player.floor++;
			}
		} else if (player.y < player.targetY) {
			player.y += player.floorSpeed;
			if (player.y >= player.targetY) {
				player.y = player.targetY;
				player.isMovingFloor = false;
				player.floor++;
			}
		}
	} else {
		//movimento orizzontale normale
		if (player.dir !== 0) player.x += player.dir * PLAYER_SPEED;
	}
	

    //uscita lato sinistro
	if (player.x < (player.w / 2)) {
		player.x = player.w / 2; //resta a sx
		player.dir = 0;

		if (exitSide === 'left') {
			//player.floor++;
			if (player.floor + 1 < FLOORS) {
				player.isMovingFloor = true;
				player.targetY = floors[player.floor+1].y - (player.h / 2);	
				playElevatorSoundBonus();
				player.timer = Date.now();
			} else {
				alert('YOU WIN!');
				resetGame();
			}
		}
	}

	//uscita lato destro
	if (player.x  > (canvas.width - player.w / 2)) {
		player.x = canvas.width - player.w / 2; //resta a dx
		player.dir = 0;
		
		if (exitSide === 'right') {
			//player.floor++;
			if (player.floor + 1 < FLOORS) {
				player.isMovingFloor = true;
				player.targetY = floors[player.floor+1].y - (player.h / 2);
				playElevatorSoundBonus();
				player.timer = Date.now();
			} else {
				alert('YOU WIN!');
				resetGame();
			}
		}
	}


    //calcolo Y player basato sul piano
    let playerY = floors[player.floor].y - (player.h / 2);
	if (!player.isMovingFloor) player.y = playerY;

	//movimento ascensori
	for(let e of elevators) {
		//gli ascensori sono bastardi!
		//calcola velocità basata su distanza dal player
		const dx = player.x - e.x;
		const dy = player.y - e.y;
		const dist = Math.sqrt(dx * dx + dy * dy);

		const range = player.w * 20;
		e.speed = ELEVATOR_MIN_SPEED + (1 - Math.min(dist, range)/range) * (ELEVATOR_MAX_SPEED - ELEVATOR_MIN_SPEED);
	
        e.y += e.dir * e.speed;

        if (e.y - e.h/2 <= 0) {
			e.dir *= -1;
			e.y = e.h/2;
			playElevatorSoundTop();
		}
		if (e.y + e.h/2 >= canvas.height) {
            e.dir *= -1;
			e.y = canvas.height - e.h/2;
			playElevatorSoundBottom();
        }

        if (checkCollision(player, e) && !player.isExploding && !godMode) {
			killPlayer();
        }		
    }
}


//gestione player morto: diminuisce vite + musichetta terribile + respawn dopo 2/3 secondi
function killPlayer() {
	playElevatorSoundHit();
		
	player.lives--;
	player.dir = 0;
	player.isExploding = true;
	player.explosionX = player.x;
	player.explosionY = player.y;
	setTimeout(function() { 
		player.isExploding = false; 
		player.timer = Date.now();
		if (player.lives === 0) gameOver();
	}, 3000);
	
	if (floors[player.floor].exit === 'left') player.x = canvas.width - player.w / 2;//dx
	else player.x = player.x = player.w / 2;//sx
}

//gestione gameover
function gameOver() {
	alert('GAME OVER!');
	resetGame();
}


//===== DRAW =====
function draw() {
	//tutto noir
    ctx.clearRect(0, 0, canvas.width, canvas.height);
	
	//bordo
	ctx.strokeStyle = COLORS.gray;
	ctx.strokeRect(0, 0, canvas.width, canvas.height);
	
    //piani
    for(let f of floors) {
		drawFloor(f);
    }
	
	//colonne/funi ascensori
	for(let c of columns) {
		drawColumn(c);
	}

    //ascensori
    for(let e of elevators) {
		drawElevator(e);
    }

    drawPlayer();
	
	if(player.timeLeft !== lastStatsUpdate || isPaused) {
		drawStats();
		lastStatsUpdate = player.timeLeft;
	}
}

//kaboom rimpiazzato dalla nuvoletta di artillery
function drawExplosion() {
	let scale = player.h / 20;
	const x = player.explosionX - player.w;
	const y = player.explosionY - player.h / 2;
	
	ctx.beginPath();
	ctx.moveTo(x, y);
	ctx.bezierCurveTo(x + 5 * scale, y - 15 * scale, x + 18 * scale, y - 25 * scale, 
					  x + 22 * scale, y - 10 * scale);
    ctx.bezierCurveTo(x + 28 * scale, y - 30 * scale, x + 42 * scale, y - 20 * scale, 
					  x + 40 * scale, y);
    ctx.bezierCurveTo(x + 45 * scale, y - 5 * scale, x + 50 * scale, y + 15 * scale, 
					  x + 42 * scale, y + 15 * scale);
    ctx.bezierCurveTo(x + 35 * scale, y + 25 * scale, x + 20 * scale, y + 20 * scale, 
					  x + 10 * scale, y + 15 * scale);
    ctx.bezierCurveTo(x + 5 * scale, y + 20 * scale, x - 5 * scale, y + 10 * scale, 
					  x, y);
	ctx.closePath();
	ctx.fillStyle = COLORS.white;
	ctx.strokeStyle = COLORS.gray;
	ctx.fill();
	ctx.stroke();
}

//colonna
function drawColumn(c) {
	ctx.fillStyle = COLORS.black;
	ctx.fillRect(c.x - 8, 0, 16, canvas.height);//centrato x
	ctx.fillStyle = COLORS.elevatorColumn;
    ctx.fillRect(c.x - 2, 0, 4, canvas.height);//centrato x
}

//piano
function drawFloor(f) {
	ctx.fillStyle = f.id % 4 === 0 ? stripesPatternA : f.id % 4 === 1 ? stripesPatternB : f.id % 4 === 2 ? stripesPatternC : stripesPatternD;
    ctx.fillRect(0, f.y, canvas.width, 5);//non centrato ma verso il basso
	
	//scala
	let posx = f.exit === 'right' ? canvas.width - 10: 20;
	let posy = f.y;
	
	ctx.fillStyle = COLORS.gray;
	ctx.fillRect(posx-10, posy, 2, -FLOOR_HEIGHT);
	ctx.fillRect(posx, posy, 2, -FLOOR_HEIGHT);
	for (let i=4; i < FLOOR_HEIGHT; i+=4) {
		ctx.fillRect(posx-10, posy - i, 10, 2);
	}
	
	//piano 0...n
	posx = f.exit === 'right' ? 5 : canvas.width - 25;
	posy = f.y - FLOOR_HEIGHT + 5;
	cart = f.exit === 'right' ? f.id + '>' : '<' + f.id;
	
	ctx.fillStyle = COLORS.greenCart;
	ctx.fillRect(posx, posy, 22, 14);
	ctx.fillStyle = COLORS.white;
	ctx.font = '14px monospace';
	ctx.fillText(cart, posx + 5, posy + 11);	
}

//ascensore
function drawElevator(e) {
	const x = (ELEVATOR_MAX_SPEED - ELEVATOR_MIN_SPEED) / 4;
	const yellowThreshold = ELEVATOR_MIN_SPEED + x;
	const orangeThreshold = ELEVATOR_MIN_SPEED + x * 2;
	const redThreshold = ELEVATOR_MIN_SPEED + x * 3;
	ctx.fillStyle = colorMode != 0 ? COLORS.white 
				  : e.speed < yellowThreshold ? COLORS.elevatorGreen
				  : e.speed < orangeThreshold ? COLORS.elevatorYellow
				  : e.speed < redThreshold ? COLORS.elevatorOrange  
				  : COLORS.elevatorRed
	ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);//centrato x+y
	
	ctx.fillStyle = COLORS.elevatorGuard;
	
	let u = e.h / 50;//se h=50 -> tutto ok, altrimenti deve scalare la guardia!
	
	//cappello
	ctx.fillRect(e.x-6*u, e.y-23*u, 12*u, 3*u);//23
	ctx.fillRect(e.x-12*u, e.y-20*u, 24*u, 2*u);//20
	//testa
	ctx.fillRect(e.x-6*u, e.y-18*u, 12*u, 6*u);//18
	//corpo alto
	ctx.fillRect(e.x-14*u, e.y-12*u, 28*u, 10*u);//12
	//corpo basso
	ctx.fillRect(e.x-10*u, e.y-2*u, 20*u, 10*u);//2
	//gambe
	ctx.fillRect(e.x-8*u, e.y+8*u, 16*u, 13*u);//8
	//piedi
	ctx.fillRect(e.x-12*u, e.y+21*u, 24*u, 2*u);//21
	//fucile
	ctx.fillRect(e.x-1*u, e.y-2*u, 20*u, 4*u);//2
	//gomito
	ctx.fillRect(e.x-15*u, e.y-4*u, 15*u, 8*u);//4
}

//utility per animare zampette
function getWalkFrame() {
    return Math.floor(performance.now() / 150) % 2;
}

//player
function drawPlayer() {
    if (player.isExploding) {drawExplosion(); return;} //non disegnare se esplode

	//ctx.strokeStyle = COLORS.debug;
	//ctx.strokeRect(player.x-1, player.y-1, 2, 2);
	//ctx.strokeRect(player.x-player.w/2,player.y-player.h/2,player.w,player.h);//centrato x+y
	
    const x = player.x;
    const y = player.y;

    const frame = player.dir !== 0 ? Math.floor(performance.now()/150) % 2 : 0;
	
	let u = player.h / 30;//se h=30 -> tutto ok, altrimenti deve scalare anche il player!
	let d = player.dir === -1 ? -1 : 1;
	
	//cappello blu
	ctx.fillStyle = COLORS.hat;
	ctx.fillRect(x-7*d *u, y-13*u, 14*u*d, 3*u);//   -7...7
	ctx.fillRect(x-10*d *u, y-10*u, 21*u*d, 3*u);//-10.....11
	
	//faccia marroncina
	ctx.fillStyle = COLORS.skin;
	ctx.fillRect(x-4*d*u, y-7*u, 11*u*d, 9*u);//  -4...7
	//naso
	ctx.fillRect(x+7*d*u, y-4*u, 4*u*d, 3*u);//      7..11
	
	//giacca bavero
	ctx.fillStyle = COLORS.jacket;
	ctx.fillRect(x-7*d*u, y-7*u, 3*u*d, 6*u);//-7..-4
	ctx.fillRect(x-7*d*u, y-1*u, 6*u*d, 3*u);//-7.....6
	ctx.fillRect(x-7*d*u, y+2*u, 14*u*d, 3*u);//-7...7
	
	//occhiale nero
	ctx.fillStyle = COLORS.glasses;
	ctx.fillRect(x-5*d*u, y-6*u, 12*u*d,3*u);
	ctx.fillRect(x+3*d*u, y-4*u, 4*u*d, 3*u);
	
	if (frame === 0) {
		//borsone bianco
		ctx.fillStyle = COLORS.bagBorder;
		ctx.fillRect(x-10*d*u, y+4*u, 18*u*d, 9*u);
		//quadrato nero
		ctx.fillStyle = COLORS.bagInner;
		ctx.fillRect(x-8*d*u, y+6*u, 14*u*d, 6*u);
		
		//braccio della giacca
		ctx.fillStyle = COLORS.jacket;
		ctx.fillRect(x-5*d*u, y+4*u, 6*u*d, 4*u);
		
		//mano
		ctx.fillStyle = COLORS.skin;
		ctx.fillRect(x-5*d*u, y+8*u, 6*u*d, 2*u);
		
		//piedini
		ctx.fillStyle = COLORS.feet;
		ctx.fillRect(x-7*d*u, y+13*u, 4*u*d, 3*u);
		ctx.fillRect(x-1*d*u, y+13*u, 4*u*d, 3*u);
	} else {
		//borsone bianco
		ctx.fillStyle = COLORS.bagBorder;
		ctx.fillRect(x-8*d*u, y+4*u, 18*u*d, 9*u);
		//quadrato nero
		ctx.fillStyle = COLORS.bagInner;
		ctx.fillRect(x-6*d*u, y+6*u, 14*u*d, 6*u);
		
		//braccio della giacca
		ctx.fillStyle = COLORS.jacket;
		ctx.fillRect(x-3*d*u, y+4*u, 6*u*d, 4*u);
		
		//mano
		ctx.fillStyle = COLORS.skin;
		ctx.fillRect(x-3*d*u, y+8*u, 6*u*d, 2*u);
		
		//piedini
		ctx.fillStyle = COLORS.feet;
		ctx.fillRect(x-5*d*u, y+13*u, 4*u*d, 3*u);
		ctx.fillRect(x+1*d*u, y+13*u, 4*u*d, 3*u);
	}
}

//HUD
function drawStats() {
	document.getElementById('timer').innerHTML = player.timeLeft;
	
	let txt = '';//&#1F3C3;==omino, &#x2B1C;==quadratone, &#x25A0;==quadratino
	for(let i=0;i<player.lives;i++) { txt += '&#x25A0; ' }
	document.getElementById('lives').innerHTML = txt;
	
	document.getElementById('soundBtn').innerText = isSoundEnabled ? '[S]OUND' : '[s]ound';
	document.getElementById('musicBtn').innerText = isMusicEnabled ? '[M]USIC' : '[m]usic';
	document.getElementById('scanLinesBtn').innerText = scanLinesEnabled ? '[X]CANLINES' : '[x]canlines';
	document.getElementById('colorModeBtn').innerText = '[C]OLOR ' + colorMode;
	document.getElementById('godModeBtn').innerText = godMode ? '[G]ODMODE' : '[g]odmode';
	document.getElementById('pauseBtn').innerText = isPaused ? '[P]AUSE' : '[p]ause';
	document.getElementById('resetBtn').innerText = '[r]eset';
}

//===== LOOP DEL GIOCO! //=====
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
loop();

</script>
